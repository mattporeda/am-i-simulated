<title>Am I Simulated?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  color-scheme:light;
  --bg:#F8F1F8; --bg2:#ECDAEC; --bg3:#E4D3E6;
  --ink:#39193E; --muted:#73487A; --muted2:#8A6690;
  --line:rgba(113,39,145,.16); --line2:rgba(113,39,145,.3);
  --gold:#866313; --gold-dim:#C7A868; --gold-ink:#FBF3EA; --gold-soft:rgba(134,99,19,.14);
  --violet:#712791; --indigo:#3D2E9E;
  --peach:#F6E3F4; --pink:#EFC2E2;
  --amber:#FAF6EC; --amber-dim:#F0E4C6; --amber-ink:#7A5C1E; --amber-sub:#8A6B2E;
  --verdant:#3F7A54; --verdant-soft:rgba(63,122,84,.14);
  --ember:#B33A2E; --ember-soft:rgba(179,58,46,.14);
  --arg-for:#5F7A62; --arg-for-soft:rgba(95,122,98,.12);
  --arg-against:#A85D4F; --arg-against-soft:rgba(168,93,79,.12);
  --panel:#FAF4FA;
  --shadow:rgba(57,25,62,.16);
}

*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0;
  background:
    radial-gradient(1px 1px at 15% 12%, rgba(134,99,19,.5), transparent),
    radial-gradient(1px 1px at 82% 8%, rgba(113,39,145,.4), transparent),
    radial-gradient(1.5px 1.5px at 35% 42%, rgba(134,99,19,.4), transparent),
    radial-gradient(1px 1px at 90% 38%, rgba(113,39,145,.35), transparent),
    radial-gradient(1px 1px at 8% 65%, rgba(208,57,133,.35), transparent),
    radial-gradient(1px 1px at 60% 85%, rgba(113,39,145,.35), transparent),
    radial-gradient(1.5px 1.5px at 6% 92%, rgba(134,99,19,.4), transparent),
    radial-gradient(ellipse 900px 650px at 25% 100%, rgba(208,57,133,.1), transparent 60%),
    radial-gradient(ellipse 750px 550px at 92% 4%, rgba(61,46,158,.09), transparent 60%),
    var(--bg);
  color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-0.01em;text-wrap:balance;}
.mono{font-family:'Jost',sans-serif;font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
button:focus-visible,input:focus-visible,.choice:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
::selection{background:var(--gold-soft);}
a{color:var(--gold);}

#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.7;}

/* shell */
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;max-width:600px;margin:0 auto;}
.brand{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:1.15rem;letter-spacing:.01em;color:var(--ink);}
.brand small{display:block;font-family:'Jost',sans-serif;font-style:normal;font-weight:500;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-top:2px;}
.progress{display:flex;align-items:center;gap:5px;}
.ptick{width:7px;height:7px;border-radius:50%;background:var(--line2);transition:background .3s,box-shadow .3s;}
.ptick.done{background:var(--gold-dim);}
.ptick.cur{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);}
main{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:6px 20px 90px;}
.screen{animation:fade .4s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:'Jost',sans-serif;font-weight:500;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin:0 0 16px;display:flex;align-items:center;gap:8px;}
.eyebrow .gn{color:var(--gold);}
h1.big{font-size:clamp(2.1rem,7.5vw,3.1rem);line-height:1.06;margin:8px 0 16px;font-style:italic;color:var(--ink);}
h2.q{font-size:clamp(1.5rem,5.6vw,2.15rem);line-height:1.16;margin:0 0 14px;font-style:italic;color:var(--ink);}
h2.q em{color:var(--gold);font-style:italic;}
.sub{color:var(--muted);font-size:1.05rem;margin:0 0 8px;max-width:48ch;font-family:'Cormorant Garamond',serif;}
.pitch{font-size:1.1rem;max-width:52ch;color:var(--ink);opacity:.92;font-family:'Cormorant Garamond',serif;}

/* the sigil box — mandala + dial */
.sigil-box{background:linear-gradient(155deg, rgba(113,39,145,.06), rgba(208,57,133,.04) 55%, rgba(253,250,252,.6) 100%);border:1px solid var(--line);border-radius:22px;padding:28px 20px 22px;margin:26px 0 20px;text-align:center;}
.sigil{width:100%;max-width:230px;margin:0 auto 6px;}
.sigil svg{width:100%;height:auto;display:block;}
.dialval{font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px;}
.dial-wrap{max-width:360px;margin:10px auto 0;position:relative;}
input[type=range]{width:100%;height:34px;background:transparent;-webkit-appearance:none;appearance:none;outline:none;margin:0;cursor:pointer;position:relative;z-index:2;}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:linear-gradient(to right,var(--gold-dim),var(--line2));border-radius:3px;}
input[type=range]::-moz-range-track{height:5px;background:linear-gradient(to right,var(--gold-dim),var(--line2));border-radius:3px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-13px;width:31px;height:31px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff,var(--bg2) 60%);border:3px solid var(--gold);box-shadow:0 2px 10px rgba(57,25,62,.25);cursor:grab;transition:transform .12s;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.08);}
input[type=range]::-moz-range-thumb{width:25px;height:25px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff,var(--bg2) 60%);border:3px solid var(--gold);box-shadow:0 2px 10px rgba(57,25,62,.25);cursor:grab;}
/* Glow lives on a real element positioned over the thumb's default (50%) resting spot —
   animating box-shadow on the range-thumb pseudo-element itself does not render reliably
   across browser engines, so the pulse is a separate absolutely-positioned div instead. */
.dial-glow{position:absolute;left:50%;top:17px;width:31px;height:31px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;animation:dialPulse 1.9s ease-out infinite;transition:opacity .3s;}
.dial-glow.gone{opacity:0;}
@keyframes dialPulse{
  0%{box-shadow:0 0 0 0 rgba(134,99,19,.55);}
  70%{box-shadow:0 0 0 16px rgba(134,99,19,0);}
  100%{box-shadow:0 0 0 0 rgba(134,99,19,0);}
}
@media (prefers-reduced-motion:reduce){ .dial-glow{ animation:none; box-shadow:0 0 0 6px rgba(134,99,19,.22); } }
.dragtip{text-align:center;font-family:'Jost',sans-serif;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);opacity:.85;margin:2px 0 0;transition:opacity .3s;}
.dragtip-top{margin:0 0 14px;}
.dragtip.gone{opacity:0;height:0;margin:0;overflow:hidden;}
.dragtip .arrow{display:inline-block;}
.dragtip .arrow.l{animation:dragNudgeL 1.6s ease-in-out infinite;}
.dragtip .arrow.r{animation:dragNudgeR 1.6s ease-in-out infinite .15s;}
@keyframes dragNudgeL{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(-3px);} }
@keyframes dragNudgeR{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(3px);} }
@media (prefers-reduced-motion:reduce){ .dragtip .arrow{animation:none;} }
.ends{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;font-weight:500;color:var(--ink);font-family:'Cormorant Garamond',serif;font-style:italic;margin-top:4px;}
.ends span{max-width:48%;}
.ends span:last-child{text-align:right;}
.translate{margin:0 0 28px;padding:18px 22px;border-radius:16px;background:linear-gradient(135deg, var(--amber), var(--amber-dim));text-align:center;}
.translate .ratio{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:1.9rem;color:var(--amber-ink);line-height:1.1;}
.translate .ratio-sub{font-family:'Jost',sans-serif;font-size:.76rem;letter-spacing:.02em;color:var(--amber-sub);margin-top:8px;line-height:1.5;}
.translate .ratio-sub b{color:var(--amber-ink);}

.choices{display:flex;flex-direction:column;gap:10px;max-width:400px;margin:16px auto 0;}
.choice{text-align:left;border:1px solid var(--line);background:rgba(113,39,145,.035);border-radius:14px;padding:14px 18px;cursor:pointer;color:var(--ink);font-size:1rem;font-family:'Cormorant Garamond',serif;transition:border-color .15s,background .15s;}
.choice b{font-weight:600;}
.choice small{display:block;color:var(--muted);font-size:.88rem;margin-top:3px;font-style:italic;}
.choice.on{border-color:var(--gold);background:linear-gradient(135deg, rgba(113,39,145,.08), rgba(208,57,133,.06));}
.choice.on b{color:var(--gold);}

.fact{margin-top:18px;font-size:1rem;color:var(--muted);padding-left:14px;border-left:2px solid var(--line);font-family:'Cormorant Garamond',serif;}
.fact b{color:var(--ink);font-weight:600;}

/* facts / arguments — a single always-visible tab strip (neutral at rest, a
   small color dot for For/Against) opening into one persistent boxed panel,
   replacing the old buried <details> accordion. */
.segstrip{display:flex;gap:6px;margin:26px 0 0;padding:5px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;}
.segbtn{flex:1;font-family:'Jost',sans-serif;font-weight:600;font-size:.74rem;letter-spacing:.03em;padding:11px 8px;border-radius:999px;border:none;background:none;color:var(--ink);cursor:pointer;text-align:center;transition:.15s;}
.segbtn .n{display:block;font-weight:500;font-size:.64rem;color:var(--muted);margin-top:2px;}
.segbtn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;position:relative;top:-1px;}
.segbtn .dot-for{background:var(--arg-for);}
.segbtn .dot-against{background:var(--arg-against);}
.segbtn.on{background:var(--gold-soft);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px rgba(134,99,19,.35);}
.segbtn.on .n{color:var(--gold);opacity:.85;}

.segpanel{margin-top:12px;padding:20px 20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-height:40px;display:flex;align-items:center;justify-content:center;transition:.15s;}
.segpanel.empty{color:var(--muted2);font-family:'Jost',sans-serif;font-size:.85rem;text-align:center;}
.segpanel:not(.empty){display:block;text-align:left;}

.flist{margin:0;padding:0;list-style:none;display:grid;gap:14px;}
.flist li{position:relative;font-size:1rem;color:var(--muted);padding-left:18px;font-family:'Cormorant Garamond',serif;}
.flist li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.85;}
.flist li b{color:var(--ink);font-weight:600;}

.argcol h4{margin:0 0 10px;font-family:'Jost',sans-serif;font-weight:500;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;}
.argcol.for h4{color:var(--arg-for);} .argcol.against h4{color:var(--arg-against);}
.argcol ul{margin:0;padding:0;list-style:none;display:grid;gap:11px;}
.argcol li{font-size:.96rem;padding-left:14px;border-left:2px solid var(--arg-for-soft);color:var(--muted);font-family:'Cormorant Garamond',serif;}
.argcol.against li{border-color:var(--arg-against-soft);}

.nav{display:flex;gap:10px;margin-top:30px;align-items:center;}
.btn{font-family:'Jost',sans-serif;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:999px;padding:14px 26px;font-size:.8rem;font-weight:500;cursor:pointer;background:var(--ink);color:var(--gold-ink);transition:filter .15s,transform .1s;}
.btn:hover{filter:brightness(1.05);} .btn:active{transform:scale(.98);}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line2);}
.btn.small{padding:9px 16px;font-size:.72rem;}
.btn.wide{width:100%;padding:16px;font-size:.85rem;}
.spacer{flex:1;}

/* hook */
.hook-sigil{width:190px;max-width:55%;margin:22px auto 4px;}
.hook-sigil svg{width:100%;height:auto;opacity:.92;}
.gutbox{margin-top:8px;text-align:center;}
.gut-num{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:2.2rem;color:var(--gold);}
.gut-num small{display:block;font-size:.82rem;color:var(--muted);font-family:'Cormorant Garamond',serif;font-weight:400;font-style:italic;margin-top:2px;}

/* wall overlay */
.overlay{position:fixed;inset:0;background:rgba(20,12,22,.84);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.wall{background:linear-gradient(155deg, rgba(179,58,46,.08), rgba(208,57,133,.05) 55%, var(--bg2) 100%);border:1px solid rgba(179,58,46,.4);border-radius:18px;padding:30px 26px;max-width:440px;width:100%;}
.wall h3{margin:0 0 10px;font-size:1.5rem;color:var(--ember);font-style:italic;font-family:'Fraunces',serif;}
.wall p{margin:0 0 22px;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:1.05rem;}

/* result */
.result-mandala-wrap{position:relative;width:220px;height:220px;margin:16px auto 8px;}
.result-mandala-wrap > svg:first-child{position:absolute;inset:0;}
.result-mandala-inner{position:absolute;inset:20px;}
.result-mandala-inner svg{width:100%;height:100%;display:block;}
.result-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(1.7rem,6.5vw,2.3rem);color:var(--gold);pointer-events:none;}
.result-lead{font-size:1.02rem;color:var(--muted);margin:12px 0 0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;}
.gutcmp{margin-top:16px;font-size:1rem;text-align:center;color:var(--muted);font-family:'Cormorant Garamond',serif;}
.gutcmp b{color:var(--ink);}
.gutcmp .mono{color:var(--gold);font-weight:600;}

.sec{margin-top:38px;}
.sec .tag{font-family:'Jost',sans-serif;font-weight:500;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);display:block;margin-bottom:14px;}
.arch{font-size:1.55rem;line-height:1.25;margin:0;font-style:italic;font-family:'Fraunces',serif;color:var(--ink);}
.arch small{display:block;font-size:.95rem;color:var(--muted);font-family:'Cormorant Garamond',serif;font-weight:400;font-style:normal;margin-top:10px;}

.spine{position:relative;padding-left:22px;}
.spine::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2);}
.wf{display:grid;gap:24px;}
.wf-row{position:relative;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;}
.wf-row.in{opacity:1;transform:none;}
.wf-row::before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--gold-dim);}
.wf-row.in::before{border-color:var(--gold);}
.wf-row .t{font-size:.98rem;color:var(--muted);font-family:'Cormorant Garamond',serif;}
.wf-row .t b{color:var(--ink);}
.wf-row .n{font-family:'Jost',sans-serif;font-weight:600;color:var(--gold);display:block;margin-top:6px;font-size:1.05rem;}
.wf-row .bar{margin-top:9px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;}
.wf-row .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .8s ease;}
.wf-row.final{background:var(--bg2);padding:16px 18px;border-radius:12px;margin-left:-18px;}
.wf-row.final::before{left:-4px;}
.wf-row.final .n{font-size:1.35rem;}

.try{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;}
.chip{font-family:'Jost',sans-serif;font-size:.72rem;padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold);}

.scale{position:relative;height:100px;margin:32px 0 4px;}
.scale .axis{position:absolute;left:0;right:0;top:50px;height:1px;background:var(--line2);}
.scale .tick{position:absolute;top:46px;width:9px;height:9px;border-radius:50%;background:var(--muted2);transform:translateX(-50%);cursor:default;}
.scale .tick.you{background:var(--gold);width:15px;height:15px;top:43px;box-shadow:0 0 0 4px var(--bg),0 0 10px rgba(134,99,19,.4);z-index:2;}
.scale .lbl{position:absolute;transform:translateX(-50%);font-size:.7rem;color:var(--muted2);white-space:nowrap;font-family:'Jost',sans-serif;}
.scale .lbl.up{top:16px;} .scale .lbl.dn{top:68px;}
.scale .lbl.you{color:var(--gold);font-weight:600;top:-4px;}
.scale .lft{transform:translateX(-6px);} .scale .rgt{transform:translateX(calc(-100% + 6px));}
.scale .tick:hover + .tip,.scale .tick:focus + .tip{opacity:1;}
.scale .tip{position:absolute;top:-32px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.72rem;padding:5px 10px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s;z-index:3;font-family:'Jost',sans-serif;}
.famous-note{font-size:.8rem;color:var(--muted2);margin-top:16px;font-family:'Cormorant Garamond',serif;font-style:italic;}

.share{background:var(--bg2);border-radius:14px;padding:20px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;white-space:pre-wrap;line-height:1.6;border:1px dashed var(--line2);color:var(--muted);}
.copyrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.btn.copied{background:var(--verdant);color:#0f231a;}

.tinker{display:grid;gap:18px;}
.trow{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding-top:16px;border-top:1px solid var(--line);}
.trow .gk{font-family:'Jost',sans-serif;font-weight:500;font-size:.66rem;color:var(--muted2);padding-top:3px;letter-spacing:.06em;}
.trow label{font-size:.95rem;font-weight:600;display:block;color:var(--ink);font-family:'Cormorant Garamond',serif;}
.trow .tv{font-size:.82rem;color:var(--muted);font-weight:400;font-family:'Jost',sans-serif;}
.trow input[type=range]{margin:8px 0 0;height:20px;}
.trow .mini{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
.trow .mini button{font-family:'Jost',sans-serif;font-size:.72rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;color:var(--muted);}
.trow .mini button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);}

.shared-banner{background:linear-gradient(135deg, var(--peach), var(--pink));border-radius:14px;padding:14px 16px;font-size:.95rem;margin-bottom:20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:#3D1743;font-family:'Cormorant Garamond',serif;}
.foot{font-family:'Jost',sans-serif;font-size:.7rem;color:var(--muted2);margin-top:36px;line-height:1.8;letter-spacing:.02em;}
.foot a{color:var(--muted);text-decoration:underline;}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:0.01ms !important;animation-duration:0.01ms !important;}
}
</style>

  <div class="brand">Am I Simulated?<small>Simulation Probability Calculator</small></div>

<script>

  // Gate 4 — Choice: Forking Path
  function branchTree(x,y,ang,len,depth,maxDepth,spreadT,op,rnd){
    if(depth>maxDepth || len<0.9 || op<0.035) return '';
    var jitter = (rnd()-0.5)*15;
    var rad=(ang+jitter*0.45)*Math.PI/180;
    var x2=x+Math.cos(rad)*len, y2=y-Math.sin(rad)*len;
    var mx=(x+x2)/2, my=(y+y2)/2;
    var curl = (rnd()-0.5)*len*0.55;
    var perpAng = rad+Math.PI/2;
    var cx=mx+Math.cos(perpAng)*curl, cy=my+Math.sin(perpAng)*curl;
    var hueMix = depth/maxDepth;
    var col = mixHex(SIG.violet, hueMix>0.55?SIG.pink:SIG.gold, Math.min(1,hueMix*1.3));
    var s = '<path d="M'+x.toFixed(1)+','+y.toFixed(1)+' Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="'+(0.3+(maxDepth-depth)*0.3)+'" opacity="'+op+'"/>';
    if(depth===maxDepth) s += '<circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="'+(0.85+1.05*spreadT)+'" fill="'+SIG.pink+'" opacity="'+op+'"/>';
    var spreadAng = 11+spreadT*25;
    var j1=(rnd()-0.5)*13, j2=(rnd()-0.5)*13;
    s += branchTree(x2,y2,ang-spreadAng+j1,len*0.79,depth+1,maxDepth,spreadT,op*0.89,rnd);
    s += branchTree(x2,y2,ang+spreadAng+j2,len*0.79,depth+1,maxDepth,spreadT,op*0.89,rnd);
    return s;

  function sigilChoice(v){

  // Gate 5 — Intensity: Nautilus Shell

  // Gate 6 — Nesting: Recursive Frame

      var rotDur = simple ? 28 : wild ? (3.2+i*0.55) : (9+i*1.7);
      s += '<rect x="'+(100-r)+'" y="'+(100-r)+'" width="'+(r*2)+'" height="'+(r*2)+'" rx="'+(r*0.28)+'" fill="none" stroke="'+cols[i%4]+'" stroke-width="1.1" opacity="'+op+'">'+
        '<animateTransform attributeName="transform" type="rotate" from="'+from+' 100 100" to="'+to+' 100 100" dur="'+rotDur+'s" repeatCount="indefinite"/>';
      if(!simple){
        var colDur = wild ? (1.6+i*0.22) : (5+i*0.7);
        s += '<animate attributeName="stroke" values="'+cols.join(';')+';'+cols[0]+'" dur="'+colDur+'s" begin="-'+(i*0.9)+'s" repeatCount="indefinite"/>';
      }
      s += '</rect>';
    }

    if(wild){
      var spokes='', nSpokes=16;
      for(var sp=0; sp<nSpokes; sp++){
        var a=(sp/nSpokes)*360, rad=a*Math.PI/180;
        var x2=100+Math.cos(rad)*94, y2=100+Math.sin(rad)*94;
        spokes += '<line x1="100" y1="100" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+cols[sp%4]+'" stroke-width=".6" opacity=".38"/>';
      }
      s += '<g><animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="5.5s" repeatCount="indefinite"/>'+spokes+'</g>';
      for(var w=0; w<4; w++){
        var wDelay = -(w*0.85);
        s += '<circle cx="100" cy="100" r="6" fill="none" stroke="'+cols[w%4]+'" stroke-width="1.1" opacity="0">'+
          '<animate attributeName="r" values="6;96" dur="3.4s" begin="'+wDelay+'s" repeatCount="indefinite"/>'+
          '<animate attributeName="opacity" values=".65;0" dur="3.4s" begin="'+wDelay+'s" repeatCount="indefinite"/>'+
          '</circle>';
      }
    }

    var tunnelN = wild?10:mode===1?4:0;
    var tDur = wild?2:3.4;
    for(var k=0;k<tunnelN;k++){
      var delay = -(k*(tDur/tunnelN));
      s += '<rect rx="26" fill="none" stroke="'+cols[k%4]+'" stroke-width="1" opacity="0">'+
        '<animate attributeName="x" values="8;99" dur="'+tDur+'s" begin="'+delay+'s" repeatCount="indefinite"/>'+
        '<animate attributeName="y" values="8;99" dur="'+tDur+'s" begin="'+delay+'s" repeatCount="indefinite"/>'+
        '<animate attributeName="width" values="184;2" dur="'+tDur+'s" begin="'+delay+'s" repeatCount="indefinite"/>'+
        '<animate attributeName="height" values="184;2" dur="'+tDur+'s" begin="'+delay+'s" repeatCount="indefinite"/>'+
        '<animate attributeName="opacity" values="0;.6;0" dur="'+tDur+'s" begin="'+delay+'s" repeatCount="indefinite"/>'+
        '</rect>';
    }
    var coreR = wild?12.5:mode===1?6:4.5;
    if(simple){
      s += '<circle cx="100" cy="100" r="'+coreR+'" fill="'+SIG.gold+'" opacity=".8">'+
        '<animate attributeName="r" values="'+(coreR*0.8)+';'+(coreR*1.25)+';'+(coreR*0.8)+'" dur="3.2s" repeatCount="indefinite"/>'+
        '</circle>';
    } else {
      s += '<circle cx="100" cy="100" r="'+coreR+'" fill="'+SIG.gold+'" opacity=".9">'+
        '<animate attributeName="fill" values="'+cols.join(';')+';'+cols[0]+'" dur="'+(wild?1.4:4.2)+'s" repeatCount="indefinite"/>'+
        '<animate attributeName="r" values="'+(coreR*0.6)+';'+(coreR*1.55)+';'+(coreR*0.6)+'" dur="'+(wild?1:2.2)+'s" repeatCount="indefinite"/>'+
        '</circle>';
    }
    return s;
  }

  // ==================================================================
  // MANDALA ENGINE — flower-of-life composite, kept for the result screen
  // ==================================================================
  var GOLD="#866313", PEACH="#F0BFE5", PINK="#D03985", INK="#39193E";
  var PETALS=[[100,70],[100,130],[74,85],[126,85],[74,115],[126,115]];

  function backdrop(){
    return '<defs><radialGradient id="nebG" cx="50%" cy="45%" r="55%">'+
      '<stop offset="0%" stop-color="'+PEACH+'" stop-opacity=".35"/>'+
      '<stop offset="55%" stop-color="'+PINK+'" stop-opacity=".18"/>'+
      '<stop offset="100%" stop-color="'+GOLD+'" stop-opacity="0"/></radialGradient></defs>'+
      '<circle cx="100" cy="100" r="92" fill="url(#nebG)"/>'+
      '<g fill="'+GOLD+'"><circle cx="60" cy="50" r="1.1" opacity=".4"/><circle cx="148" cy="58" r="1" opacity=".32"/><circle cx="145" cy="145" r="1.2" opacity=".35"/><circle cx="52" cy="145" r="1" opacity=".32"/></g>';
  }
  function boundaryRing(op, dash){ return '<circle cx="100" cy="100" r="88" fill="none" stroke="'+GOLD+'" stroke-width=".7" opacity="'+op+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>'; }
  function petalRing(op, sw, dash){
    var d = dash?(' stroke-dasharray="'+dash+'"'):'';
    return PETALS.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+sw+'" opacity="'+op+'"'+d+'/>';}).join('')+
      '<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+sw+'" opacity="'+op+'"'+d+'/>';
  }
  function centerDot(r, op){ return '<circle cx="100" cy="100" r="'+r+'" fill="'+INK+'" opacity="'+op+'"/>'; }
  function miniFlower(cx,cy,scale,op,sw){
    sw = sw||2.4;
    var pts=[[0,-30],[0,30],[-26,-15],[26,-15],[-26,15],[26,15],[0,0]];
    var g = pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+sw+'" opacity="'+op+'"/>';}).join('');
    return '<g transform="translate('+cx+','+cy+') scale('+scale+')">'+g+'</g>';
  }
  function svgWrap(inner){ return '<svg viewBox="0 0 200 200">'+inner+'</svg>'; }
  function setMandala(hostId, inner){ var host=document.getElementById(hostId); if(host) host.innerHTML = svgWrap(inner); }

  // Composite — your reading: every gate's transformation, layered into one sigil
  function mandalaComposite(s){
    var t1=s.g1/100, t2=s.g2/100, pre=t1*t2;
    var healthy=Math.round((s.g3/100)*6);
    var choiceT=s.g4/100, intensityT=s.g5/100;
    var inner=backdrop()+boundaryRing(0.25+0.3*pre);
    PETALS.forEach(function(p,i){
      if(i<healthy) inner+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+(0.8+0.5*pre)+'" opacity="'+(0.25+0.55*pre)+'"/>';
      else inner+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width=".6" opacity=".15" stroke-dasharray="2 5"/>';
    });
    inner += (healthy>=6?'<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+(0.8+0.5*pre)+'" opacity="'+(0.25+0.55*pre)+'"/>':'<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width=".6" opacity=".18" stroke-dasharray="2 5"/>');
    var outerPos=[[100,26],[174,66],[174,134],[100,174],[26,134],[26,66]];
    var n=choiceT*6;
    outerPos.forEach(function(p,i){ var op=Math.max(0,Math.min(1,n-i)); if(op>0) inner+=miniFlower(p[0],p[1],.22,op*.55,2.6); });
    var field=[{p:[18,15],s:.16,o:.5},{p:[182,20],s:.14,o:.45},{p:[20,182],s:.15,o:.5},{p:[182,168],s:.16,o:.5},{p:[90,8],s:.13,o:.4},{p:[100,192],s:.14,o:.45}];
    var fcount=Math.round(intensityT*field.length);
    for(var i=0;i<fcount;i++){ inner+=miniFlower(field[i].p[0],field[i].p[1],field[i].s,field[i].o,3); }
    if(s.g6>=1){ PETALS.forEach(function(p){ inner+=miniFlower(p[0],p[1],.22,s.g6===2?.55:.6,2.4); }); }
    if(s.g6===2){ inner+='<circle cx="100" cy="100" r="20" fill="none" stroke="'+PEACH+'" stroke-width=".6" opacity=".5"/><circle cx="100" cy="100" r="13" fill="none" stroke="'+PEACH+'" stroke-width=".6" opacity=".65"/>'; }
    var m=model(s);
    var cr = 4+9*Math.sqrt(Math.max(0,Math.min(1,m.final)));
    inner += centerDot(cr, 0.85+0.15*Math.min(1,m.final*3));
    return inner;
  }

  // Hook screen — the mandala before any gate has been answered, driven live
  // by the gut-feeling dial: at 0 it's nearly bare (one dashed boundary,
  // a faint seed); as the dial climbs toward 100 the six petals resolve one
  // by one, outer accents and field flourishes appear, and the center
  // brightens — the same flower-of-life geometry the result screen's
  // composite reading uses, just walked from simple to fully expanded.
  function sigilGutFeel(v){
    var t = Math.max(0,Math.min(1,v/100));
    var filled = t*6;
    var inner = backdrop()+boundaryRing(.28+.52*t, t>0.97?null:"2 6");
    PETALS.forEach(function(p,i){
      var lt = Math.max(0,Math.min(1,filled-i));
      if(lt>0) inner += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+(0.8+0.6*lt)+'" opacity="'+(0.25+0.55*lt)+'"/>';
      else inner += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width=".6" opacity=".16" stroke-dasharray="2 5"/>';
    });
    var clt = Math.max(0,Math.min(1,filled-6));
    inner += clt>0
      ? '<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+(0.8+0.6*clt)+'" opacity="'+(0.25+0.55*clt)+'"/>'
      : '<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width=".6" opacity=".16" stroke-dasharray="2 5"/>';
    var outerPos=[[100,26],[174,66],[174,134],[100,174],[26,134],[26,66]];
    var n=t*6;
    outerPos.forEach(function(p,i){ var op=Math.max(0,Math.min(1,n-i)); if(op>0) inner+=miniFlower(p[0],p[1],.22,op*.5,2.4); });
    var field=[{p:[18,15],s:.16},{p:[182,20],s:.14},{p:[20,182],s:.15},{p:[182,168],s:.16},{p:[90,8],s:.13},{p:[100,192],s:.14}];
    var fcount=Math.round(t*t*field.length);
    for(var i=0;i<fcount;i++){ inner+=miniFlower(field[i].p[0],field[i].p[1],field[i].s,.42,2.6); }
    inner += centerDot(3+10*Math.sqrt(t), .5+.4*t);
    return '<g><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="70s" repeatCount="indefinite"/>'+
      '<g opacity=".92"><animate attributeName="opacity" values=".7;1;.7" dur="5s" repeatCount="indefinite"/>'+inner+'</g></g>';
  }

  function updateMandala(g){
    var inner;
    if(g.k==="g1") inner=sigilConscious(S.g1);
    else if(g.k==="g2") inner=sigilPhysics(S.g2);
    else if(g.k==="g3") inner=sigilSurvival(S.g3);
    else if(g.k==="g4") inner=sigilChoice(S.g4);
    else if(g.k==="g5") inner=sigilIntensity(S.g5);
    else if(g.k==="g6") inner=sigilNesting(S.g6);
    setMandala("mandalaHost", inner);
  }

  // ---- ambient background: drifting starlight ----
  (function ambient(){
    var c = document.getElementById("bgCanvas");
    var ctx = c.getContext("2d");
    var pts = [];
    function resize(){
      c.width = innerWidth; c.height = innerHeight;
      pts = [];
      var n = innerWidth<500 ? 30 : 54;
      for(var i=0;i<n;i++) pts.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.2+.4, s:Math.random()*.14+.03, o:Math.random()*.5+.14, p:Math.random()*6.28});
    }
    resize();
    addEventListener("resize", resize);
    function draw(t){
      ctx.clearRect(0,0,c.width,c.height);
      for(var i=0;i<pts.length;i++){
        var p=pts[i];
        if(!REDUCED){ p.y-=p.s; if(p.y<-4){p.y=c.height+4; p.x=Math.random()*c.width;} }
        var flick = REDUCED?1:(0.65+0.35*Math.sin(t/1500+p.p));
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.29);
        ctx.fillStyle = (i%3===0?"rgba(134,99,19,":"rgba(113,39,145,")+(p.o*flick*0.5).toFixed(3)+")";
        ctx.fill();
      }
      if(!REDUCED) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();

  // ---- ring gauge (SVG) for the result reading ----
  function ringSVG(id, size, sw){
    var r=(size-sw)/2, c=2*Math.PI*r;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">'+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(113,39,145,.16)" stroke-width="'+sw+'"/>'+
      '<circle id="'+id+'" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#866313" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" style="transition:stroke-dashoffset .6s ease"/>'+
      '</svg>';
  }
  function setRing(elId, frac){
    var el = document.getElementById(elId); if(!el) return;
    var r = el.r.baseVal.value, c=2*Math.PI*r;
    el.setAttribute("stroke-dasharray", c);
    el.setAttribute("stroke-dashoffset", c*(1-Math.max(0,Math.min(1,frac))));
  }

  // ---------- rendering ----------
  var root = document.getElementById("screen");
  var prog = document.getElementById("progress");

  function renderProgress(){
    if(S.screen===0 || S.screen===7){ prog.innerHTML=""; return; }
    prog.innerHTML = G.map(function(g,i){ var idx=i+1; var cls = idx<S.screen?"done":idx===S.screen?"cur":""; return '<span class="ptick '+cls+'" title="'+g.name+'"></span>'; }).join("");
  }

  function render(){
    renderProgress();
    if(S.screen===0) renderHook();
    else if(S.screen>=1 && S.screen<=6) renderGate(S.screen);
    else renderResult();
    window.scrollTo(0,0);
  }

  function renderHook(){
    root.innerHTML =
      '<div class="screen">'+
        '<p class="eyebrow">Six inputs · three minutes · one probability</p>'+
        '<h1 class="big">Are you living in a simulation?</h1>'+
        '<p class="pitch">First, a gut check. Then six beliefs — about consciousness, physics, survival, and more. We run the real math and hand back one number: your probability, given exactly what you believe.</p>'+
        '<div class="hook-sigil" id="hookSigil"></div>'+
        '<div class="gutbox">'+
          '<p class="eyebrow" style="justify-content:center;margin-bottom:10px">Gut check: are you living in a simulation?</p>'+
          '<div class="gut-num" id="gutNum">'+S.gut+'%</div>'+
          '<div class="dial-wrap">'+
          '<input type="range" min="0" max="100" step="5" value="'+S.gut+'" id="gut" aria-label="Gut feeling: chance you are simulated">'+
          '<div class="ends"><span>Definitely real</span><span>Definitely a sim</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="nav"><button class="btn wide" id="start">Let\'s calculate my probability</button></div>'+
        '<p class="foot">Built on Nick Bostrom\'s simulation argument, with the math done honestly. Your answers stay on this device.</p>'+
      '</div>';
    setMandala("hookSigil", sigilGutFeel(S.gut));
    var gut=document.getElementById("gut");
    function syncGut(){ document.getElementById("gutNum").innerHTML=S.gut+'%'; setMandala("hookSigil", sigilGutFeel(S.gut)); }
    gut.addEventListener("input",function(){ S.gut=parseInt(gut.value,10); syncGut(); });
    document.getElementById("start").addEventListener("click",function(){ S.screen=1; render(); });
  }

  function controlHTML(g){
    if(g.type==="choice"){
      return '<div class="choices">'+g.choices.map(function(c,i){ return '<button class="choice'+(S.g6===i?" on":"")+'" data-i="'+i+'"><b>'+c.t+'</b><small>'+c.d+'</small></button>'; }).join("")+'</div>';
    }
    var showHint = !TOUCHED[g.k];
    return '<div class="dialval" id="val">'+valueLabel(g)+'</div>'+
      '<div class="dial-wrap">'+
      (showHint ? '<div class="dial-glow" id="glow"></div>' : '')+
      '<input type="range" min="0" max="100" step="10" value="'+S[g.k]+'" id="rng" aria-label="'+g.name+'">'+
      '<div class="ends"><span>'+g.lo+'</span><span>'+g.hi+'</span></div>'+
      '</div>';
  }

  // facts/for/against tab content, built live from the gate's own data —
  // never hand-duplicated, so it can never drift from the real copy.
  function segContent(g){
    return {
      facts: '<ul class="flist">'+g.facts.map(function(f){return "<li>"+f+"</li>";}).join("")+'</ul>',
      "for": '<div class="argcol for"><ul>'+g.args.for.map(function(a){return "<li>"+a+"</li>";}).join("")+'</ul></div>',
      against: '<div class="argcol against"><ul>'+g.args.against.map(function(a){return "<li>"+a+"</li>";}).join("")+'</ul></div>'
    };
  }
  var SEG_EMPTY = "Tap a tab above to see what's behind your answer";

  function refreshTranslate(g){
    var tb = translateBox(g);
    document.getElementById("ratio").textContent = tb.ratio;
    document.getElementById("ratiosub").innerHTML = tb.sub;
  }

  function renderGate(n){
    var g=G[n-1];
    var tb = translateBox(g);
    var showHint = g.type!=="choice" && !TOUCHED[g.k];
    root.innerHTML =
      '<div class="screen">'+
        '<p class="eyebrow"><span class="gn">'+n+'</span> / 6 · '+g.name+'</p>'+
        '<h2 class="q">'+g.q+'</h2>'+
        '<p class="sub">'+g.sub+'</p>'+
        '<div class="sigil-box">'+
          (showHint ? '<p class="dragtip dragtip-top" id="dragtip"><span class="arrow l">‹</span> drag to answer <span class="arrow r">›</span></p>' : '')+
          '<div class="sigil" id="mandalaHost"></div>'+controlHTML(g)+
        '</div>'+
        '<div class="translate" id="tr"><div class="ratio" id="ratio">'+tb.ratio+'</div><div class="ratio-sub" id="ratiosub">'+tb.sub+'</div></div>'+
        '<div class="segstrip">'+
          '<button class="segbtn" data-seg="facts">What we know<span class="n">'+g.facts.length+' facts</span></button>'+
          '<button class="segbtn" data-seg="for"><span class="dot dot-for"></span>For<span class="n">'+g.args.for.length+' arguments</span></button>'+
          '<button class="segbtn" data-seg="against"><span class="dot dot-against"></span>Against<span class="n">'+g.args.against.length+' arguments</span></button>'+
        '</div>'+
        '<div class="segpanel empty" id="segpanel">'+SEG_EMPTY+'</div>'+
        '<div class="nav"><button class="btn ghost" id="back">Back</button><div class="spacer"></div><button class="btn" id="next">'+(n===6?"Reveal my number":"Next")+'</button></div>'+
      '</div>';
    updateMandala(g);
    if(g.type==="choice"){
      root.querySelectorAll(".choice").forEach(function(b){ b.addEventListener("click",function(){ S.g6=parseInt(b.getAttribute("data-i"),10); root.querySelectorAll(".choice").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); refreshTranslate(g); updateMandala(g); }); });
    } else {
      var rng=document.getElementById("rng");
      rng.addEventListener("input",function(){
        S[g.k]=parseInt(rng.value,10);
        TOUCHED[g.k]=true;
        document.getElementById("val").textContent=valueLabel(g);
        refreshTranslate(g);
        updateMandala(g);
        var tip=document.getElementById("dragtip"); if(tip) tip.classList.add("gone");
        var glow=document.getElementById("glow"); if(glow) glow.classList.add("gone");
      });
    }
    var segC = segContent(g);
    root.querySelectorAll(".segbtn").forEach(function(b){
      b.addEventListener("click",function(){
        var seg = b.getAttribute("data-seg");
        var already = b.classList.contains("on");
        root.querySelectorAll(".segbtn").forEach(function(x){x.classList.remove("on");});
        var panel = document.getElementById("segpanel");
        if(already){
          panel.innerHTML = SEG_EMPTY;
          panel.classList.add("empty");
        } else {
          b.classList.add("on");
          panel.innerHTML = segC[seg];
          panel.classList.remove("empty");
        }
      });
    });
    document.getElementById("back").addEventListener("click",function(){ S.screen=n-1; render(); });
    document.getElementById("next").addEventListener("click",function(){
      if(n<=4 && S[g.k]===0 && !walled[g.k]){ showWall(g,n); return; }
      S.screen=n+1; render();
    });
  }

  function showWall(g,n){
    var o=document.getElementById("overlayRoot");
    o.innerHTML='<div class="overlay"><div class="wall"><p class="eyebrow" style="color:var(--ember)">The chain breaks here</p><h3>0%. Game over — for this argument.</h3><p>'+g.wall+'</p>'+
      '<div class="nav" style="margin-top:0"><button class="btn ghost" id="w-yes">Yep, that\'s what I think</button><div class="spacer"></div><button class="btn" id="w-no">Hm, let me reconsider</button></div></div></div>';
    document.getElementById("w-yes").addEventListener("click",function(){ walled[g.k]=true; o.innerHTML=""; S.screen=7; render(); });
    document.getElementById("w-no").addEventListener("click",function(){ S[g.k]=10; o.innerHTML=""; renderGate(n); });
  }

  function famousHTML(p){
    var you=p*100;
    var edge=function(x){ return x<12?" lft":x>88?" rgt":""; };
    var items=FAMOUS.map(function(f,i){ var x=Math.min(98,Math.max(2,f.p)); return '<div class="tick" tabindex="0" style="left:'+x+'%" aria-label="'+f.n+': '+f.q+'"></div><div class="tip'+edge(x)+'" style="left:'+x+'%">'+f.n+' — '+f.q+'</div><div class="lbl '+(i%2?"dn":"up")+edge(x)+'" style="left:'+x+'%">'+f.n+'</div>'; }).join("");
    var yx=Math.min(98,Math.max(2,you));
    items+='<div class="tick you" style="left:'+yx+'%"></div><div class="lbl you'+edge(yx)+'" style="left:'+yx+'%">you</div>';
    var below=null,above=null;
    FAMOUS.forEach(function(f){ if(f.p<=you && (!below||f.p>below.p)) below=f; if(f.p>you && (!above||f.p<above.p)) above=f; });
    var sent = below&&above ? "More simulated than "+below.n+", less than "+above.n+"." : below ? "Further out than everyone here — even "+below.n+"." : "More skeptical than everyone here — even "+(above?above.n:"")+".";
    return '<div class="scale"><div class="axis"></div>'+items+'</div><p style="margin:8px 0 0;color:var(--muted);font-family:\'Cormorant Garamond\',serif;font-style:italic">'+sent+'</p><p class="famous-note">Public statements, paraphrased. Hover a dot for the quote.</p>';
  }

  function resultMandalaHTML(m){
    return '<div class="result-mandala-wrap">'+
      ringSVG("resRing",220,7)+
      '<div class="result-mandala-inner">'+svgWrap(mandalaComposite(S))+'</div>'+
      '<div class="result-num" id="bigNum">'+fmtPct(m.final)+'</div>'+
    '</div>';
  }

  function resultTopHTML(){
    var m=model(S), b=binding(S), a=archetype(S);
    var gap = Math.round(m.final*100) - S.gut;
    var gapLine = m.wallAt ? "Your gut said "+S.gut+"%. Your logic says the argument can't even start." :
      Math.abs(gap)<3 ? "Your gut said "+S.gut+"%. Your logic agrees. Rare." :
      gap>0 ? "Your gut said "+S.gut+"%. Your own beliefs say <b>"+fmtPct(m.final)+"</b> — you're more of a sim than you thought." :
              "Your gut said "+S.gut+"%. Your own beliefs say <b>"+fmtPct(m.final)+"</b> — you believe in this less than you feel it.";
    var sharedBanner = S.shared ? '<div class="shared-banner"><span>Someone shared their result with you. This is <b>their</b> number.</span><button class="btn small" id="takeit">Take the quiz yourself</button></div>' : '';

    var rows=[];
    rows.push({t:"A simulating civilization makes, per real mind…", n:fmtMult(m.N)+" simulated"});
    rows.push({t:"…but only <b>"+(S.g3===100?"nearly all":S.g3===0?"none":"1 in "+RATE_N[S.g3])+"</b> civilizations survive to build it", n:m.sv===0?"×0":m.sv>=0.5?"×"+m.sv:"÷"+fmtInt(1/m.sv)});
    rows.push({t:"…and only <b>"+S.g4+"%</b> of those choose to", n:"→ "+(m.r===0?"nothing":fmtR(m.r))});
    if(S.g6>0 && m.r>0){
      var bTxt = m.b>=1 ? fmtInt(m.b)+" simulators' worth" : "only "+(Math.round(m.b*100)/100)+" of a simulator";
      var nTxt = m.nestMult===Infinity ? "→ no bottom. Unbounded." : "→ ×"+(m.nestMult>=100?fmtInt(m.nestMult):Math.round(m.nestMult*10)/10)+" more minds";
      rows.push({t:"…then the simulations build their own: each level spawns <b>"+bTxt+"</b> (tipping point: 1)"+(S.g6===1?", for three levels":", forever"), n:nTxt});
    }
    rows.push({t:"So <i>if</i> simulation is possible at all, the odds you're in one are", n:fmtPct(m.f), bar:m.f});
    rows.push({t:"× your belief that it's possible at all — conscious ("+S.g1+"%) × physics ("+S.g2+"%) = <b>"+fmtPct(m.pre)+"</b>", n:fmtPct(m.final), bar:m.final, final:true});
    var wf = rows.map(function(r,i){ return '<div class="wf-row'+(r.final?" final":"")+'"><div class="t">'+r.t+'</div><span class="n">'+r.n+'</span>'+(r.bar!==undefined?'<div class="bar"><i data-w="'+(r.bar*100)+'"></i></div>':'')+'</div>'; }).join("");

    var skepticNote = (!m.wallAt && (S.g1<=50||S.g2<=50) && m.f>0.85) ? '<p class="fact" style="margin-top:18px"><b>Notice:</b> you leaned skeptical on whether this is even possible — but '+Math.min(S.g1,S.g2)+'% isn\'t “no,” it\'s “'+tenths(Math.min(S.g1,S.g2))+'.” Everything downstream of that is near-certain in your world, so that one number is your whole answer.</p>' : '';

    var changeMind = m.wallAt ? '<p style="margin:0;color:var(--muted);font-family:\'Cormorant Garamond\',serif">Move <b style="color:var(--ink)">'+G[m.wallAt-1].name+'</b> off zero and the argument restarts. Right now it never begins.</p>' :
      b.jump<0.005 ? '<p style="margin:0;color:var(--muted);font-family:\'Cormorant Garamond\',serif">Nothing moves you much. You\'ve either maxed everything, or your ceiling is already set.</p>' :
      '<p style="margin:0;color:var(--muted);font-family:\'Cormorant Garamond\',serif">Move <b style="color:var(--ink)">'+G[b.gate-1].name+'</b> to '+MAX_LABEL[b.gate]+' and you\'d be at <b class="mono" style="color:var(--gold)">'+fmtPct(b.to)+'</b>'+(b.jump>0.2?" — that one dial owns your answer.":" — nothing else moves you as much.")+'</p>'+
      '<div class="try"><button class="btn small" id="tryit">Try it</button>'+(S.tried?'<span class="chip">tried: '+G[S.tried-1].name+'</span><button class="btn small ghost" id="undo">Undo</button>':'')+'</div>';

    return sharedBanner +
      '<p class="eyebrow" style="justify-content:center">Your reading</p>'+
      resultMandalaHTML(m)+
      '<p class="result-lead">'+(m.final>0&&m.final<0.5?oneIn(m.final)+" · ":"")+'chance you\'re a simulated mind, on your own beliefs</p>'+
      '<p class="gutcmp">'+gapLine+'</p>'+
      '<div class="sec"><span class="tag">You are</span><p class="arch display">'+a.title+'<small>'+a.sub+'</small></p></div>'+
      '<div class="sec"><span class="tag">How your number was built</span><div class="spine"><div class="wf">'+wf+'</div></div>'+skepticNote+'</div>'+
      '<div class="sec"><span class="tag">Where your doubt lives</span><p style="margin:0;color:var(--muted);font-family:\'Cormorant Garamond\',serif">'+(m.wallAt?G[m.wallAt-1].wall:DOUBT[b.gate])+'</p></div>'+
      '<div class="sec"><span class="tag">What would change your mind</span>'+changeMind+'</div>'+
      '<div class="sec"><span class="tag">Where you land among the famous</span>'+famousHTML(m.final)+'</div>'+
      '<div class="sec"><span class="tag">Share it</span><div class="share" id="shareBox">'+shareText().replace(/</g,"&lt;")+'</div>'+
        '<div class="copyrow"><button class="btn" id="copy">Copy result</button><button class="btn ghost" id="copylink">Copy link only</button></div></div>';
  }

  function bindResultTop(){
    var b=binding(S);
    var m=model(S);
    setRing("resRing", m.final);
    var take=document.getElementById("takeit"); if(take) take.addEventListener("click",function(){ resetAll(); });
    var tryBtn=document.getElementById("tryit"); if(tryBtn) tryBtn.addEventListener("click",function(){ if(!S.prevState) S.prevState={g1:S.g1,g2:S.g2,g3:S.g3,g4:S.g4,g5:S.g5,g6:S.g6}; var t=maxed(S,b.gate); S.g1=t.g1;S.g2=t.g2;S.g3=t.g3;S.g4=t.g4;S.g5=t.g5;S.g6=t.g6; S.tried=b.gate; refreshResultQuiet(true); });
    var undo=document.getElementById("undo"); if(undo) undo.addEventListener("click",function(){ if(S.prevState){ Object.assign(S,S.prevState); S.prevState=null; } S.tried=null; refreshResultQuiet(true); });
    document.getElementById("copy").addEventListener("click",function(){ copyText(shareText(), this, "Copied — go paste it"); });
    document.getElementById("copylink").addEventListener("click",function(){ copyText(shareUrl(), this, "Link copied"); });
  }
  function resetAll(){
    S={gut:50,g1:50,g2:50,g3:50,g4:50,g5:50,g6:0,screen:0,shared:false,tried:null}; walled={};
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    render();
  }

  function renderResult(){
    var m=model(S);
    root.innerHTML =
      '<div class="screen"><div id="rtop">'+resultTopHTML()+'</div>'+
        '<div class="sec"><span class="tag">Tinker</span><p style="margin:0 0 6px;color:var(--muted);font-size:.92rem;font-family:\'Cormorant Garamond\',serif">Change any answer. Everything above updates.</p><div class="tinker" id="tinker">'+tinkerHTML()+'</div></div>'+
        '<div class="nav"><button class="btn ghost" id="retake">Start over</button></div>'+
        '<p class="foot">Am I Simulated? · a six-gate reading of Bostrom\'s simulation argument, not a measurement. Sources: Bostrom (2003), Putnam, Dennett, Searle, Penrose, Tononi, Chalmers <i>Reality+</i>, Benatar, Ord.</p>'+
      '</div>';
    var wrows=root.querySelectorAll(".wf-row");
    wrows.forEach(function(r,i){ setTimeout(function(){ r.classList.add("in"); var bar=r.querySelector(".bar i"); if(bar) setTimeout(function(){ bar.style.width=Math.max(0.5,parseFloat(bar.getAttribute("data-w")))+"%"; },80); }, 250+i*380); });
    countUp(document.getElementById("bigNum"), m.final);
    bindResultTop();
    document.getElementById("retake").addEventListener("click",resetAll);
    bindTinker();
  }

  function tinkerHTML(){
    return G.map(function(g,i){
      var ctl = g.type==="choice"
        ? '<div class="mini">'+g.choices.map(function(c,j){ return '<button data-k="g6" data-v="'+j+'" class="'+(S.g6===j?"on":"")+'">'+c.t+'</button>'; }).join("")+'</div>'
        : '<input type="range" min="0" max="100" step="10" value="'+S[g.k]+'" data-k="'+g.k+'" aria-label="'+g.name+'">';
      return '<div class="trow"><div class="gk mono">'+g.name.slice(0,3).toUpperCase()+'</div><div><label>'+g.name+' <span class="tv mono">'+gateSetting(g)+'</span></label>'+ctl+'</div></div>';
    }).join("");
  }
  function bindTinker(){
    root.querySelectorAll("#tinker input[type=range]").forEach(function(r){
      r.addEventListener("input",function(){ S[r.getAttribute("data-k")]=parseInt(r.value,10); S.tried=null; S.prevState=null; refreshResultQuiet(false); });
    });
    root.querySelectorAll("#tinker .mini button").forEach(function(b){
      b.addEventListener("click",function(){ S.g6=parseInt(b.getAttribute("data-v"),10); S.tried=null; S.prevState=null; refreshResultQuiet(false); });
    });
  }
  function syncTinker(){
    root.querySelectorAll("#tinker .trow").forEach(function(row,i){
      var g=G[i]; var tv=row.querySelector(".tv"); if(tv) tv.textContent=gateSetting(g);
    });
    root.querySelectorAll("#tinker input[type=range]").forEach(function(r){ var k=r.getAttribute("data-k"); if(parseInt(r.value,10)!==S[k]) r.value=S[k]; });
    root.querySelectorAll("#tinker .mini button").forEach(function(b){ b.classList.toggle("on", parseInt(b.getAttribute("data-v"),10)===S.g6); });
  }
  function refreshResultQuiet(syncControls){
    var y=window.scrollY;
    quiet=true;
    document.getElementById("rtop").innerHTML=resultTopHTML();
    quiet=false;
    root.querySelectorAll("#rtop .wf-row").forEach(function(r){ r.classList.add("in"); var bar=r.querySelector(".bar i"); if(bar){ bar.style.transition="none"; bar.style.width=Math.max(0.5,parseFloat(bar.getAttribute("data-w")))+"%"; } });
    bindResultTop();
    syncTinker();
    window.scrollTo(0,y);
  }

  var quiet=false;
  function countUp(el,p){
    if(quiet || REDUCED || p===0){ el.textContent=fmtPct(p); return; }
    var start=performance.now(), dur=1100;
    function step(t){ var k=Math.min(1,(t-start)/dur); var e=1-Math.pow(1-k,3); el.textContent=fmtPct(p*e); if(k<1) requestAnimationFrame(step); else el.textContent=fmtPct(p); }
    requestAnimationFrame(step);
  }
  function copyText(text, btn, okLabel){
    var orig=btn.textContent;
    function done(){ btn.textContent=okLabel; btn.classList.add("copied"); setTimeout(function(){ btn.textContent=orig; btn.classList.remove("copied"); },1800); }
    try{ navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text,done); }); }catch(e){ fallbackCopy(text,done); }
  }
  function fallbackCopy(text,cb){ try{ var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); cb(); }catch(e){} }

  document.addEventListener("keydown",function(e){ if(e.key==="Enter" && S.screen>=0 && S.screen<=6){ var n=document.getElementById("next")||document.getElementById("start"); if(n && document.activeElement.tagName!=="BUTTON") n.click(); } });

  // ---------- boot ----------
  if(decodeState(location.hash)){ S.shared=true; S.screen=7; }
  render();
})();
</script>


</body></html></body></html>
