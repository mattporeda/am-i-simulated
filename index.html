<title>Am I Simulated?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  color-scheme:dark;
  --bg:#2A1B2E; --bg2:#241726; --bg3:#1E1421;
  --ink:#FBF3EA; --muted:#CBAAB0; --muted2:#9A7E86;
  --line:rgba(232,185,120,.22); --line2:rgba(232,185,120,.34);
  --gold:#E8B978; --gold-dim:#8A6B3E; --gold-ink:#3A2210; --gold-soft:rgba(232,185,120,.16);
  --peach:#F4C9A4; --pink:#E8A6A0;
  --verdant:#7FAE8C; --verdant-soft:rgba(127,174,140,.15);
  --ember:#C1503A; --ember-soft:rgba(193,80,58,.15);
  --shadow:rgba(0,0,0,0.45);
}

*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0;
  background:
    radial-gradient(1px 1px at 15% 12%, #fff9, transparent),
    radial-gradient(1px 1px at 82% 8%, #fff7, transparent),
    radial-gradient(1.5px 1.5px at 35% 42%, #fff8, transparent),
    radial-gradient(1px 1px at 90% 38%, #fff6, transparent),
    radial-gradient(1px 1px at 8% 65%, #fff6, transparent),
    radial-gradient(1px 1px at 60% 85%, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 6% 92%, #fff6, transparent),
    radial-gradient(ellipse 900px 650px at 25% 100%, rgba(244,201,164,.14), transparent 60%),
    radial-gradient(ellipse 750px 550px at 92% 4%, rgba(232,166,160,.13), transparent 60%),
    var(--bg);
  color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-0.01em;text-wrap:balance;}
.mono{font-family:'Jost',sans-serif;font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
button:focus-visible,input:focus-visible,.choice:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
::selection{background:var(--gold-soft);}
a{color:var(--gold);}

#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.7;}

/* shell */
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;max-width:600px;margin:0 auto;}
.brand{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:1.15rem;letter-spacing:.01em;color:var(--ink);}
.brand small{display:block;font-family:'Jost',sans-serif;font-style:normal;font-weight:500;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-top:2px;}
.progress{display:flex;align-items:center;gap:5px;}
.ptick{width:7px;height:7px;border-radius:50%;background:var(--line2);transition:background .3s,box-shadow .3s;}
.ptick.done{background:var(--gold-dim);}
.ptick.cur{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);}
main{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:6px 20px 90px;}
.screen{animation:fade .4s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:'Jost',sans-serif;font-weight:500;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin:0 0 16px;display:flex;align-items:center;gap:8px;}
.eyebrow .gn{color:var(--gold);}
h1.big{font-size:clamp(2.1rem,7.5vw,3.1rem);line-height:1.06;margin:8px 0 16px;font-style:italic;color:var(--ink);}
h2.q{font-size:clamp(1.5rem,5.6vw,2.15rem);line-height:1.16;margin:0 0 14px;font-style:italic;color:var(--ink);}
h2.q em{color:var(--gold);font-style:italic;}
.sub{color:var(--muted);font-size:1.05rem;margin:0 0 8px;max-width:48ch;font-family:'Cormorant Garamond',serif;}
.pitch{font-size:1.1rem;max-width:52ch;color:var(--ink);opacity:.92;font-family:'Cormorant Garamond',serif;}

/* the sigil box — mandala + dial */
.sigil-box{background:linear-gradient(155deg, rgba(232,185,120,.07), rgba(232,166,160,.03) 55%, rgba(255,255,255,.02) 100%);border:1px solid var(--line);border-radius:22px;padding:28px 20px 22px;margin:26px 0 20px;text-align:center;}
.sigil{width:100%;max-width:230px;margin:0 auto 6px;}
.sigil svg{width:100%;height:auto;display:block;}
.dialval{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:1.9rem;color:var(--gold);margin-top:6px;}
.dial-wrap{max-width:360px;margin:10px auto 0;}
input[type=range]{width:100%;height:24px;background:transparent;-webkit-appearance:none;appearance:none;outline:none;margin:0;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--gold-dim),var(--line2));border-radius:3px;}
input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:3px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-9px;width:22px;height:22px;border-radius:50%;background:var(--bg2);border:3px solid var(--gold);box-shadow:0 0 12px rgba(232,185,120,.35);cursor:grab;}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:3px solid var(--gold);border-radius:50%;background:var(--bg2);box-shadow:0 0 12px rgba(232,185,120,.35);cursor:grab;}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-family:'Cormorant Garamond',serif;font-style:italic;margin-top:4px;}
.ends span{max-width:48%;}
.ends span:last-child{text-align:right;}
.translate{margin:0 0 28px;padding:18px 22px;border-radius:16px;background:linear-gradient(135deg, var(--peach), var(--pink));}
.translate p{margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.08rem;color:#3A2210;}
.translate b{font-weight:700;color:#5A2C10;font-style:normal;}

.choices{display:flex;flex-direction:column;gap:10px;max-width:400px;margin:16px auto 0;}
.choice{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:14px 18px;cursor:pointer;color:var(--ink);font-size:1rem;font-family:'Cormorant Garamond',serif;transition:border-color .15s,background .15s;}
.choice b{font-weight:600;}
.choice small{display:block;color:var(--muted);font-size:.88rem;margin-top:3px;font-style:italic;}
.choice.on{border-color:var(--gold);background:linear-gradient(135deg, rgba(244,201,164,.14), rgba(232,166,160,.08));}
.choice.on b{color:var(--gold);}

.facts{margin-top:28px;}
.facts .flabel,.args-label{font-family:'Jost',sans-serif;font-weight:500;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin:0 0 14px;}
.facts ul{margin:0;padding:0;list-style:none;display:grid;gap:14px;}
.facts li{position:relative;font-size:1rem;color:var(--muted);padding-left:18px;font-family:'Cormorant Garamond',serif;}
.facts li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.85;}
.facts li b{color:var(--ink);font-weight:600;}
.fact{margin-top:18px;font-size:1rem;color:var(--muted);padding-left:14px;border-left:2px solid var(--line);font-family:'Cormorant Garamond',serif;}
.fact b{color:var(--ink);font-weight:600;}

details{margin-top:22px;border-top:1px solid var(--line);}
summary{cursor:pointer;padding:15px 0;font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);list-style:none;display:flex;align-items:center;gap:8px;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"+";color:var(--gold);font-size:1rem;line-height:1;}
details[open] summary::before{content:"–";}
.args{display:grid;gap:22px;padding-bottom:16px;}
.args h4{margin:0 0 8px;font-family:'Jost',sans-serif;font-weight:500;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;}
.args h4.for{color:var(--verdant);} .args h4.against{color:var(--ember);}
.args ul{margin:0;padding:0;list-style:none;display:grid;gap:11px;}
.args li{font-size:.96rem;padding-left:14px;border-left:2px solid var(--line);color:var(--muted);font-family:'Cormorant Garamond',serif;}
.args h4.for ~ ul li{border-color:var(--verdant-soft);}
.args h4.against ~ ul li{border-color:var(--ember-soft);}

.nav{display:flex;gap:10px;margin-top:30px;align-items:center;}
.btn{font-family:'Jost',sans-serif;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:999px;padding:14px 26px;font-size:.8rem;font-weight:500;cursor:pointer;background:var(--ink);color:var(--gold-ink);transition:filter .15s,transform .1s;}
.btn:hover{filter:brightness(1.05);} .btn:active{transform:scale(.98);}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line2);}
.btn.small{padding:9px 16px;font-size:.72rem;}
.btn.wide{width:100%;padding:16px;font-size:.85rem;}
.spacer{flex:1;}

/* hook */
.hook-sigil{width:190px;max-width:55%;margin:22px auto 4px;}
.hook-sigil svg{width:100%;height:auto;opacity:.92;}
.gutbox{margin-top:8px;text-align:center;}
.gut-num{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:2.2rem;color:var(--gold);}
.gut-num small{display:block;font-size:.82rem;color:var(--muted);font-family:'Cormorant Garamond',serif;font-weight:400;font-style:italic;margin-top:2px;}

/* wall overlay */
.overlay{position:fixed;inset:0;background:rgba(20,12,22,.84);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.wall{background:linear-gradient(155deg, rgba(232,185,120,.08), rgba(232,166,160,.04) 55%, var(--bg2) 100%);border:1px solid rgba(193,80,58,.45);border-radius:18px;padding:30px 26px;max-width:440px;width:100%;}
.wall h3{margin:0 0 10px;font-size:1.5rem;color:var(--ember);font-style:italic;font-family:'Fraunces',serif;}
.wall p{margin:0 0 22px;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:1.05rem;}

/* result */
.result-mandala-wrap{position:relative;width:220px;height:220px;margin:16px auto 8px;}
.result-mandala-wrap > svg:first-child{position:absolute;inset:0;}
.result-mandala-inner{position:absolute;inset:20px;}
.result-mandala-inner svg{width:100%;height:100%;display:block;}
.result-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(1.7rem,6.5vw,2.3rem);color:var(--gold);pointer-events:none;}
.result-lead{font-size:1.02rem;color:var(--muted);margin:12px 0 0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;}
.gutcmp{margin-top:16px;font-size:1rem;text-align:center;color:var(--muted);font-family:'Cormorant Garamond',serif;}
.gutcmp b{color:var(--ink);}
.gutcmp .mono{color:var(--gold);font-weight:600;}

.sec{margin-top:38px;}
.sec .tag{font-family:'Jost',sans-serif;font-weight:500;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);display:block;margin-bottom:14px;}
.arch{font-size:1.55rem;line-height:1.25;margin:0;font-style:italic;font-family:'Fraunces',serif;color:var(--ink);}
.arch small{display:block;font-size:.95rem;color:var(--muted);font-family:'Cormorant Garamond',serif;font-weight:400;font-style:normal;margin-top:10px;}

.spine{position:relative;padding-left:22px;}
.spine::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2);}
.wf{display:grid;gap:24px;}
.wf-row{position:relative;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;}
.wf-row.in{opacity:1;transform:none;}
.wf-row::before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--gold-dim);}
.wf-row.in::before{border-color:var(--gold);}
.wf-row .t{font-size:.98rem;color:var(--muted);font-family:'Cormorant Garamond',serif;}
.wf-row .t b{color:var(--ink);}
.wf-row .n{font-family:'Jost',sans-serif;font-weight:600;color:var(--gold);display:block;margin-top:6px;font-size:1.05rem;}
.wf-row .bar{margin-top:9px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;}
.wf-row .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .8s ease;}
.wf-row.final{background:var(--bg2);padding:16px 18px;border-radius:12px;margin-left:-18px;}
.wf-row.final::before{left:-4px;}
.wf-row.final .n{font-size:1.35rem;}

.try{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;}
.chip{font-family:'Jost',sans-serif;font-size:.72rem;padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold);}

.scale{position:relative;height:100px;margin:32px 0 4px;}
.scale .axis{position:absolute;left:0;right:0;top:50px;height:1px;background:var(--line2);}
.scale .tick{position:absolute;top:46px;width:9px;height:9px;border-radius:50%;background:var(--muted2);transform:translateX(-50%);cursor:default;}
.scale .tick.you{background:var(--gold);width:15px;height:15px;top:43px;box-shadow:0 0 0 4px var(--bg),0 0 10px rgba(232,185,120,.4);z-index:2;}
.scale .lbl{position:absolute;transform:translateX(-50%);font-size:.7rem;color:var(--muted2);white-space:nowrap;font-family:'Jost',sans-serif;}
.scale .lbl.up{top:16px;} .scale .lbl.dn{top:68px;}
.scale .lbl.you{color:var(--gold);font-weight:600;top:-4px;}
.scale .lft{transform:translateX(-6px);} .scale .rgt{transform:translateX(calc(-100% + 6px));}
.scale .tick:hover + .tip,.scale .tick:focus + .tip{opacity:1;}
.scale .tip{position:absolute;top:-32px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.72rem;padding:5px 10px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s;z-index:3;font-family:'Jost',sans-serif;}
.famous-note{font-size:.8rem;color:var(--muted2);margin-top:16px;font-family:'Cormorant Garamond',serif;font-style:italic;}

.share{background:var(--bg2);border-radius:14px;padding:20px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;white-space:pre-wrap;line-height:1.6;border:1px dashed var(--line2);color:var(--muted);}
.copyrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.btn.copied{background:var(--verdant);color:#0f231a;}

.tinker{display:grid;gap:18px;}
.trow{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding-top:16px;border-top:1px solid var(--line);}
.trow .gk{font-family:'Jost',sans-serif;font-weight:500;font-size:.66rem;color:var(--muted2);padding-top:3px;letter-spacing:.06em;}
.trow label{font-size:.95rem;font-weight:600;display:block;color:var(--ink);font-family:'Cormorant Garamond',serif;}
.trow .tv{font-size:.82rem;color:var(--muted);font-weight:400;font-family:'Jost',sans-serif;}
.trow input[type=range]{margin:8px 0 0;height:20px;}
.trow .mini{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
.trow .mini button{font-family:'Jost',sans-serif;font-size:.72rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;color:var(--muted);}
.trow .mini button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);}

.shared-banner{background:linear-gradient(135deg, var(--peach), var(--pink));border-radius:14px;padding:14px 16px;font-size:.95rem;margin-bottom:20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:#3A2210;font-family:'Cormorant Garamond',serif;}
.foot{font-family:'Jost',sans-serif;font-size:.7rem;color:var(--muted2);margin-top:36px;line-height:1.8;letter-spacing:.02em;}
.foot a{color:var(--muted);text-decoration:underline;}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:0.01ms !important;animation-duration:0.01ms !important;}
}
</style>

<canvas id="bgCanvas"></canvas>
<div class="top">
  <div class="brand">Am I Simulated?<small>a simulation probability instrument</small></div>
  <div class="progress" id="progress"></div>
</div>
<main id="screen"></main>
<div id="overlayRoot"></div>

<script>
(function(){
  var REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- gate data ----------
  var G = [
    {k:"g1", em:"🧠", name:"Conscious", type:"pct",
     q:"Can we build something that's truly <em>conscious</em>?",
     sub:"Conscious: it feels, it has an inside — someone's in there, not just processing. And “build” can mean anything: growing a brain from scratch, copying one wire-for-wire, or writing it in code.",
     lo:"No. Just a very good mirror.", hi:"Yes. Someone's looking back.",
     facts:[
       "No law of physics rules it out — the question is whether it would <i>work</i>, not whether it's allowed.",
       "We're already partway there on copying: full wiring diagrams of simple brains (like the fruit fly) have been mapped and simulated.",
       "There's no scientific test that can detect consciousness in anything — we can't even fully confirm it in insects, let alone a machine."],
     wall:"In your world, no computation can ever be a someone. Every “mind” ever built, however sophisticated, is just a mirror reflecting inputs back out. There's no one looking back — and there never will be.",
     args:{for:[
       "<b>Functionalism</b> (Putnam, Dennett): consciousness is the pattern, not the material — hand the same pattern to any substrate and it should work, like a dance handed to any dancer.",
       "<b>Evolution already did it with “dumb” matter</b>: mindless, unplanned physical processes stumbled into consciousness once. Deliberately engineering the same organization shouldn't be categorically harder.",
       "<b>Ship of Theseus, for your brain</b>: swap your neurons one at a time for identical artificial ones — most philosophers think you'd stay conscious throughout. The material changed completely; you didn't."],
      against:[
       "<b>Searle's Chinese Room</b>: computation is symbol-shuffling by rule — meaning-blind by definition. His own analogy: simulating digestion never gets anything digested.",
       "<b>Penrose–Hameroff</b>: the brain may run physics no algorithm can — possibly uncomputable quantum processes, argued via Gödel. Not the wrong code; the wrong physics entirely.",
       "<b>Integrated Information Theory</b> (Tononi): digital chips are built to be decomposable into separable logic gates. Consciousness may require the opposite — no software fixes the wrong architecture."]}},
    {k:"g2", em:"⚛️", name:"Physics", type:"pct",
     q:"Could a civilization ever build a computer powerful enough to simulate a mind — and a whole world around it?",
     sub:"Not “could we write clever software.” Could the actual laws of physics — how much computation fits in matter and energy — ever support a machine this capable?",
     lo:"No. No universe could foot the bill.", hi:"Yes. Just render what's being watched.",
     facts:[
       "Physics allows staggering computational density (the Bekenstein bound, Bremermann's limit) — dozens of orders of magnitude above anything built so far, no known wall yet.",
       "A simulation doesn't need to compute everything at once — full detail only where something's observed, the same trick game engines already use.",
       "The universe may cap total information in any region (the holographic principle, from black hole thermodynamics) — a possible hard ceiling on how much anything can ever store."],
     wall:"In your world, no computation — however advanced — could ever be dense enough to run a mind at scale. Reality's fine details simply aren't affordable. Nobody, anywhere, could build this.",
     args:{for:[
       "<b>The headroom is enormous</b>: ordinary, non-exotic physics alone vastly exceeds what's needed to run every mind that's ever existed.",
       "<b>Render on demand</b>: computing only what's observed could cut real costs by many orders of magnitude versus full-universe simulation.",
       "<b>We're already on this curve</b>: compute per unit of energy has grown for decades with no wall in sight — extrapolate centuries of ordinary progress, no miracles required."],
      against:[
       "<b>A hard information ceiling</b>: the holographic principle implies a finite cap on any bounded region — push fidelity far enough and nothing gets past it.",
       "<b>The shortcut might not survive scrutiny</b>: many simultaneous, cross-checking observers could force near-full-fidelity computation everywhere, quietly erasing the savings.",
       "<b>The compute might need the wrong kind of physics</b>: if minds require the exotic quantum processes raised in the Conscious gate, no classical processing power — however vast — is the right <i>kind</i> of computation."]}},
    {k:"g3", em:"🛸", name:"Survival", type:"rate",
     q:"Of every civilization that reaches our level of technology, how many survive long enough to build one of these simulators?",
     sub:"Not humans specifically — any civilization, anywhere, that gets as far as we are today. Is this stage of development a death trap, or just a speed bump?",
     lo:"None survive. Ever.", hi:"Nearly all make it through.",
     facts:[
       "We have exactly one data point, and it hasn't finished the test — we can't confirm survival is even possible, only that it hasn't been ruled out.",
       "The universe looks empty, and that silence is evidence: no signals, no megastructures, anywhere, despite billions of years' head start available to others.",
       "We're inside the danger window right now, for the first time in history — nuclear weapons, engineered pathogens, and fast-advancing AI are all live at once, in our lifetime."],
     wall:"In your world, every civilization that reaches our level destroys itself before going further. The Great Filter is absolute, dead ahead of every civilization, ours included. No one ever builds the machine.",
     args:{for:[
       "<b>Capability tends to bring control</b>: global nuclear stockpiles fell from ~70,000 warheads at the Cold War peak to ~12,000 today, via treaties and monitoring built to match the risk.",
       "<b>We keep almost dying, and not dying</b>: the Cuban Missile Crisis, Petrov's 1983 false-alarm call — real near-misses that didn't convert into extinction.",
       "<b>You only need to spread out once</b>: settling even one other world turns single-point extinction risks into merely local disasters."],
      against:[
       "<b>The Fermi Paradox</b>: the silence is the loudest evidence we have — but genuinely ambiguous. Could mean a severe filter, or civilizations hiding, or expansion we simply can't detect.",
       "<b>Stacked, unprecedented risks</b>: nuclear weapons, engineered pandemics, and self-improving AI, all at once, with no successful precedent for any. Some researchers put total extinction risk this century at roughly 1-in-6.",
       "<b>The Vulnerable World Hypothesis</b> (Bostrom): as destructive tech gets cheaper and reaches smaller groups, defense needs total, permanent compliance — offense only needs one actor, once."]}},
    {k:"g4", em:"🤖", name:"Choice", type:"pct",
     q:"Of the civilizations that could build these simulations, how many actually choose to run them?",
     sub:"Not whether it's possible — that's Physics. Whether they'd <i>want</i> to. A mature civilization only needs some fraction, out of potentially billions, to want this.",

  var RATE_LABEL = {100:"Nearly all survive",90:"About 1 in 10",80:"About 1 in 100",70:"About 1 in 1,000",60:"About 1 in 10,000",50:"About 1 in 100,000",40:"About 1 in a million",30:"About 1 in 10 million",20:"About 1 in 100 million",10:"About 1 in a billion",0:"None. Ever."};
  var RATE_N = {90:"10",80:"100",70:"1,000",60:"10,000",50:"100,000",40:"a million",30:"10 million",20:"100 million",10:"a billion"};
  var MULT_LABEL = {0:"1 simulated per 100,000 real",10:"1 per 10,000 real",20:"1 per 1,000 real",30:"1 per 100 real",40:"1 per 10 real",50:"As many simulated as real",60:"10× more simulated",70:"100× more",80:"1,000× more",90:"10,000× more",100:"100,000× more — like video games"};

  function rateVal(s){ return s===0?0 : s===100?0.99 : Math.pow(10,(s-100)/10); }
  function multVal(s){ return Math.pow(10,(s-50)/10); }

  // ---------- state ----------
  var S = {gut:50, g1:50, g2:50, g3:50, g4:50, g5:50, g6:0, screen:0, shared:false, tried:null};
  var walled = {};

  // ---------- model ----------
  function model(s){
    var c1=s.g1/100, c2=s.g2/100, sv=rateVal(s.g3), ch=s.g4/100, N=multVal(s.g5);
    var pre=c1*c2, fp=sv*ch, r=fp*N;
    var b = N*ch;
    var S1 = r;
    var S3 = r*(1+b+b*b);
    var Sinf = b<1 ? r/(1-b) : Infinity;
    var f0 = S1/(1+S1);
    var f3 = S3/(1+S3);
    var fInf = b<1 ? Sinf/(1+Sinf) : 1;
    var f = s.g6===0?f0 : s.g6===1?f3 : fInf;
    var nestMult = s.g6===0?1 : s.g6===1?(1+b+b*b) : (b<1?1/(1-b):Infinity);
    var wallAt = s.g1===0?1 : s.g2===0?2 : s.g3===0?3 : s.g4===0?4 : 0;
    return {c1:c1,c2:c2,sv:sv,ch:ch,N:N,pre:pre,fp:fp,r:r,b:b,nestMult:nestMult,f0:f0,f:f,final:pre*f,wallAt:wallAt};
  }
  function maxed(s,i){
    var t = Object.assign({},s);
    if(i===1)t.g1=100; if(i===2)t.g2=100; if(i===3)t.g3=100; if(i===4)t.g4=100; if(i===5)t.g5=100; if(i===6)t.g6=2;
    return t;
  }
  function binding(s){
    var m = model(s);
    if(m.wallAt) return {gate:m.wallAt, jump:0, to:model(maxed(s,m.wallAt)).final, wall:true};
    var best={gate:0,jump:-1,to:0};
    for(var i=1;i<=6;i++){
      var to = model(maxed(s,i)).final, j = to-m.final;
      if(j>best.jump+1e-12){best={gate:i,jump:j,to:to};}
    }
    return best;
  }

  // ---------- formatting ----------
  function fmtInt(n){ return Math.round(n).toLocaleString("en-US"); }
  function fmtPct(p){
    if(p<=0) return "0%";
    var x=p*100;
    if(x>=99.95) return "99.9%+";
    if(x>=99) return (Math.round(x*10)/10)+"%";
    if(x>=10) return Math.round(x)+"%";
    if(x>=1) return (Math.round(x*10)/10)+"%";
    if(x>=0.01) return (Math.round(x*100)/100)+"%";
    return "<0.01%";
  }
  function sig2(n){ var m=Math.pow(10,Math.floor(Math.log10(n))-1); return Math.round(n/m)*m; }
  function oneIn(p){ if(p<=0) return ""; if(p>=0.5) return ""; return "about 1 in "+fmtInt(sig2(1/p)); }
  function fmtMult(N){ return N>=1 ? fmtInt(N)+"×" : "1 per "+fmtInt(1/N); }
  function fmtR(r){ if(r>=1) return fmtInt(r)+" simulated for every real mind"; if(r>=0.01) return (Math.round(r*100)/100)+" simulated per real mind"; return "1 simulated for every "+fmtInt(1/r)+" real minds"; }
  function tenths(v){ return (v/10)+"-in-10"; }

  function translate(g){
    var v=S[g.k];
    if(g.k==="g1"){ if(v===0)return "You're saying: <b>never.</b> Nothing built can ever be conscious — only reflect."; if(v===100)return "You're saying: <b>certain.</b> Build the pattern right, and someone's looking back."; return "You're saying: a <b>"+tenths(v)+"</b> chance that a truly conscious thing could ever be built."; }
    if(g.k==="g2"){ if(v===0)return "You're saying: <b>impossible.</b> No universe could ever foot the bill."; if(v===100)return "You're saying: <b>certain.</b> The physics easily allows it."; return "You're saying: a <b>"+tenths(v)+"</b> chance the physics allows a machine powerful enough."; }
    if(g.k==="g3"){ if(v===0)return "You're saying: <b>no civilization ever makes it.</b>"; if(v===100)return "You're saying: <b>almost every</b> civilization like ours makes it."; return "You're saying: of every <b>"+RATE_N[v]+"</b> civilizations like ours, <b>one</b> survives long enough."; }
    if(g.k==="g4"){ if(v===0)return "You're saying: <b>none would.</b> It's forbidden everywhere, forever."; if(v===100)return "You're saying: <b>every one</b> of them would."; return "You're saying: <b>"+(v/10)+" in 10</b> civilizations that could, would."; }
    if(g.k==="g5"){ var N=multVal(v); if(N>=1) return "You're saying: for every real person, they make <b>"+fmtInt(N)+"</b> simulated one"+(N>1?"s":"")+"."; return "You're saying: for every <b>"+fmtInt(1/N)+"</b> real people, they make <b>one</b> simulated person."; }
    if(g.k==="g6"){
      var mm=model(S); var bb=mm.b; var bTxt = bb>=1 ? fmtInt(bb)+" simulators' worth" : (Math.round(bb*100)/100)+" of a simulator";
      var tip = v===0 ? "" : " At your other settings, each simulated level would spawn <b>"+bTxt+"</b> — "+(bb>=1?"<b>past</b> the tipping point of 1, so the levels "+(v===2?"never end.":"grow fast for three levels."):"<b>below</b> the tipping point of 1, so it thins out.");
      return ["You're saying: <b>one level only.</b> Simulations don't build simulations.","You're saying: <b>a few levels deep.</b> It happens, then it stops.","You're saying: <b>infinite levels.</b> Every level builds the next."][v] + tip;
    }
    return "";
  }
  function valueLabel(g){
    var v=S[g.k];
    if(g.type==="pct") return v+"%";
    if(g.type==="rate") return RATE_LABEL[v];
    if(g.type==="mult") return MULT_LABEL[v];
    return "";
  }
  function gateSetting(g){
    var v=S[g.k];
    if(g.type==="pct") return v+"%";
    if(g.type==="rate") return v===100?"nearly all":v===0?"none":"1 in "+RATE_N[v];
    if(g.type==="mult") return fmtMult(multVal(v));
    return ["one level only","a few levels deep","infinite levels"][v];
  }
  function bars(g){ var v=S[g.k]; var n = g.type==="choice" ? (v===0?1:v===1?3:5) : Math.round(v/20); var s=""; for(var i=0;i<5;i++) s+= i<n?"▰":"▱"; return s; }

  // ---------- archetype ----------
  var BIND_LABEL = {1:"The Empty Mirror",2:"the Physics Budget",3:"the Great Filter",4:"Anti-Natalism",5:"Small-Batch Simulation",6:"Single-Level Thinking"};
  var BIND_NOUN  = {1:"a Mirror Skeptic",2:"a Budget Hawk",3:"a Great Filter Believer",4:"an Anti-Natalist",5:"a Minimalist",6:"a Single-Level Skeptic"};

    1:"Your doubt lives in the mirror: you don't think anything built could ever truly feel — only reflect. Searle, Penrose, and Tononi are with you; the functionalists aren't.",

  function band(p){ return p<0.01?"Base Reality Believer":p<0.10?"Mostly Real":p<0.35?"Nervous Realist":p<0.65?"Coin-Flipper":p<0.90?"Probably a Sim":"Neo"; }
  function archetype(s){
    var m=model(s), b=binding(s);

    if(elon) return {title:"Elon.", sub:"Billions to one. Congratulations."};
    if(m.wallAt) return {title:"Base Reality Believer", sub:"The chain breaks at "+G[m.wallAt-1].name+". Nothing else you believe matters."};

  var FAMOUS = [
    {n:"Hossenfelder",p:3,q:"Physicist — calls it pseudoscience, not a testable hypothesis"},

  // ---------- share / url ----------
  function encodeState(){ return [S.g1,S.g2,S.g3,S.g4,S.g5,S.g6,S.gut].join("-"); }
  function decodeState(h){
    var m = /r=([\d-]+)/.exec(h||""); if(!m) return false;
    var p = m[1].split("-").map(Number); if(p.length<7 || p.some(isNaN)) return false;
    S.g1=clamp10(p[0]); S.g2=clamp10(p[1]); S.g3=clamp10(p[2]); S.g4=clamp10(p[3]); S.g5=clamp10(p[4]); S.g6=Math.min(2,Math.max(0,p[5]|0)); S.gut=Math.min(100,Math.max(0,p[6]|0));
    return true;
  }
  function clamp10(v){ v=Math.round(v/10)*10; return Math.min(100,Math.max(0,v)); }
  function shareUrl(){ return location.href.split("#")[0] + "#r=" + encodeState(); }
  function shareText(){
    var m=model(S), a=archetype(S);
    var line = "🔮 I'm "+fmtPct(m.final)+" simulated.";
    var gl = G.map(function(g){ return g.em+bars(g); }).join(" ");
    return line+"\n"+a.title+"\n"+gl+"\nMy gut said "+S.gut+"%. What's yours?\n"+shareUrl();
  }

  // ==================================================================
  // MANDALA ENGINE — every gate is a transformation of the same
  // flower-of-life sigil. Six mechanisms, one visual grammar.
  // ==================================================================
  var GOLD="#E8B978", PEACH="#F4C9A4", PINK="#E8A6A0", INK="#FBF3EA", DEEP="#2A1B2E";
  var PETALS=[[100,70],[100,130],[74,85],[126,85],[74,115],[126,115]];

  function backdrop(){
    return '<defs><radialGradient id="nebG" cx="50%" cy="45%" r="55%">'+
      '<stop offset="0%" stop-color="'+PEACH+'" stop-opacity=".35"/>'+
      '<stop offset="55%" stop-color="'+PINK+'" stop-opacity=".18"/>'+
      '<stop offset="100%" stop-color="'+GOLD+'" stop-opacity="0"/></radialGradient></defs>'+
      '<circle cx="100" cy="100" r="92" fill="url(#nebG)"/>'+
      '<g fill="#fff"><circle cx="60" cy="50" r="1.1" opacity=".55"/><circle cx="148" cy="58" r="1" opacity=".45"/><circle cx="145" cy="145" r="1.2" opacity=".5"/><circle cx="52" cy="145" r="1" opacity=".45"/></g>';
  }
  function boundaryRing(op, dash){ return '<circle cx="100" cy="100" r="88" fill="none" stroke="'+GOLD+'" stroke-width=".7" opacity="'+op+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>'; }
  function petalRing(op, sw, dash){
    var d = dash?(' stroke-dasharray="'+dash+'"'):'';
    return PETALS.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+sw+'" opacity="'+op+'"'+d+'/>';}).join('')+
      '<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+sw+'" opacity="'+op+'"'+d+'/>';
  }
  function centerDot(r, op){ return '<circle cx="100" cy="100" r="'+r+'" fill="'+INK+'" opacity="'+op+'"/>'; }
  function miniFlower(cx,cy,scale,op,sw){
    sw = sw||2.4;
    var pts=[[0,-30],[0,30],[-26,-15],[26,-15],[-26,15],[26,15],[0,0]];
    var g = pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+sw+'" opacity="'+op+'"/>';}).join('');
    return '<g transform="translate('+cx+','+cy+') scale('+scale+')">'+g+'</g>';
  }
  function svgWrap(inner){ return '<svg viewBox="0 0 200 200">'+inner+'</svg>'; }
  function setMandala(hostId, inner){ var host=document.getElementById(hostId); if(host) host.innerHTML = svgWrap(inner); }

  // Gate 1 — Conscious: bud closed → full bloom
  function mandalaConscious(v){
    var t=v/100;
    return backdrop()+boundaryRing(0.2+0.25*t)+petalRing(0.12+0.72*t, 0.8+0.4*t)+
      '<circle cx="100" cy="100" r="'+(9+8*t)+'" fill="none" stroke="'+INK+'" stroke-width=".6" opacity="'+(0.25+0.25*t)+'"/>'+
      centerDot(4+5*t, 0.45+0.45*t);
  }
  // Gate 2 — Physics: sparse & hazy → dense tracery and nested rings
  function mandalaPhysics(v){
    var t=v/100, tracery=Math.max(0,(t-0.45)/0.55);
    var inner = backdrop()+boundaryRing(0.25+0.35*t, t<0.4?'2 5':null)+petalRing(0.12+0.6*t, 0.5+0.7*t, t<0.3?'1 4':null);
    if(tracery>0){
      inner += '<circle cx="100" cy="100" r="20" fill="none" stroke="'+PEACH+'" stroke-width=".6" opacity="'+(0.6*tracery)+'"/>'+
        '<circle cx="100" cy="100" r="12" fill="none" stroke="'+PEACH+'" stroke-width=".6" opacity="'+(0.7*tracery)+'"/>'+
        '<g stroke="'+GOLD+'" stroke-width=".6" opacity="'+(0.55*tracery)+'">'+
        '<line x1="100" y1="12" x2="100" y2="188"/><line x1="12" y1="100" x2="188" y2="100"/>'+
        '<line x1="35" y1="35" x2="165" y2="165"/><line x1="165" y1="35" x2="35" y2="165"/></g>';
    }
    return inner + centerDot(5+3*t, 0.5+0.45*t);
  }
  // Gate 3 — Survival: petals wilt & fragment → stay whole and vivid
  function mandalaSurvival(v){
    var t=v/100, healthy=Math.round(t*6);
    var inner = backdrop()+boundaryRing(0.15+0.25*t);
    PETALS.forEach(function(p,i){
      if(i<healthy) inner+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width="1.1" opacity=".8"/>';
      else inner+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width=".7" opacity=".18" stroke-dasharray="2 5"/>';
    });
    inner += (healthy>=6? '<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width="1.1" opacity=".8"/>' : '<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width=".7" opacity=".25" stroke-dasharray="2 5"/>');
    return inner + centerDot(2+6*t, 0.35+0.55*t);
  }
  // Gate 4 — Choice: solitary flower → echoes outward into six siblings
  function mandalaChoice(v){
    var t=v/100;
    var inner = backdrop()+boundaryRing(.3)+petalRing(.75,1.1)+centerDot(6,.85);
    var outerPos=[[100,26],[174,66],[174,134],[100,174],[26,134],[26,66]];
    var n=t*6;
    outerPos.forEach(function(p,i){ var op=Math.max(0,Math.min(1,n-i)); if(op>0) inner+=miniFlower(p[0],p[1],.26,op*.7,2.6); });
    return inner;
  }
  // Gate 5 — Intensity: one bloom → a multiplying, irregular field
  function mandalaIntensity(v){
    var t=v/100, count=Math.round(t*12);
    var field=[
      {p:[18,15],s:.24,o:.8,sw:2.6},{p:[178,22],s:.2,o:.7,sw:2.8},{p:[22,178],s:.22,o:.75,sw:2.7},
      {p:[182,168],s:.25,o:.8,sw:2.5},{p:[10,95],s:.19,o:.65,sw:2.9},{p:[188,100],s:.21,o:.7,sw:2.8},
      {p:[85,8],s:.18,o:.65,sw:3},{p:[100,192],s:.2,o:.7,sw:2.8},{p:[48,52],s:.15,o:.55,sw:3.2},
      {p:[155,45],s:.16,o:.6,sw:3.1},{p:[45,150],s:.16,o:.6,sw:3.1},{p:[158,152],s:.15,o:.55,sw:3.2}
    ];
    var inner=backdrop()+boundaryRing(.25);
    for(var i=0;i<count;i++){ var f=field[i]; inner+=miniFlower(f.p[0],f.p[1],f.s,f.o,f.sw); }
    inner += '<circle cx="100" cy="100" r="38" fill="'+DEEP+'" opacity=".55"/>';
    inner += petalRing(.9,1.3)+centerDot(7,.9);
    return inner;
  }
  // Gate 6 — Nesting: one level → petals within petals → infinite, glowing recursion
  function mandalaNesting(idx){
    var inner = backdrop()+boundaryRing(.3)+petalRing(idx>0?.45:.75, idx>0?1:1.1);
    if(idx>=1){ PETALS.forEach(function(p){ inner+=miniFlower(p[0],p[1],.3,idx===2?.7:.8,2.3); }); }
    if(idx===2){
      inner+='<circle cx="100" cy="100" r="20" fill="none" stroke="'+PEACH+'" stroke-width=".6" opacity=".5"/>'+
        '<circle cx="100" cy="100" r="13" fill="none" stroke="'+PEACH+'" stroke-width=".6" opacity=".65"/>';
    }
    return inner+centerDot(idx===2?8:6, idx===2?1:.85);
  }
  // Composite — your reading: every gate's transformation, layered into one sigil
  function mandalaComposite(s){
    var t1=s.g1/100, t2=s.g2/100, pre=t1*t2;
    var healthy=Math.round((s.g3/100)*6);
    var choiceT=s.g4/100, intensityT=s.g5/100;
    var inner=backdrop()+boundaryRing(0.25+0.3*pre);
    PETALS.forEach(function(p,i){
      if(i<healthy) inner+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+(0.8+0.5*pre)+'" opacity="'+(0.25+0.55*pre)+'"/>';
      else inner+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="30" fill="none" stroke="'+GOLD+'" stroke-width=".6" opacity=".15" stroke-dasharray="2 5"/>';
    });
    inner += (healthy>=6?'<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width="'+(0.8+0.5*pre)+'" opacity="'+(0.25+0.55*pre)+'"/>':'<circle cx="100" cy="100" r="30" fill="none" stroke="'+GOLD+'" stroke-width=".6" opacity=".18" stroke-dasharray="2 5"/>');
    var outerPos=[[100,26],[174,66],[174,134],[100,174],[26,134],[26,66]];
    var n=choiceT*6;
    outerPos.forEach(function(p,i){ var op=Math.max(0,Math.min(1,n-i)); if(op>0) inner+=miniFlower(p[0],p[1],.22,op*.55,2.6); });
    var field=[{p:[18,15],s:.16,o:.5},{p:[182,20],s:.14,o:.45},{p:[20,182],s:.15,o:.5},{p:[182,168],s:.16,o:.5},{p:[90,8],s:.13,o:.4},{p:[100,192],s:.14,o:.45}];
    var fcount=Math.round(intensityT*field.length);
    for(var i=0;i<fcount;i++){ inner+=miniFlower(field[i].p[0],field[i].p[1],field[i].s,field[i].o,3); }
    if(s.g6>=1){ PETALS.forEach(function(p){ inner+=miniFlower(p[0],p[1],.22,s.g6===2?.55:.6,2.4); }); }
    if(s.g6===2){ inner+='<circle cx="100" cy="100" r="20" fill="none" stroke="'+PEACH+'" stroke-width=".6" opacity=".5"/><circle cx="100" cy="100" r="13" fill="none" stroke="'+PEACH+'" stroke-width=".6" opacity=".65"/>'; }
    var m=model(s);
    var cr = 4+9*Math.sqrt(Math.max(0,Math.min(1,m.final)));
    inner += centerDot(cr, 0.85+0.15*Math.min(1,m.final*3));
    return inner;
  }

  // ---- ambient background: drifting starlight ----
  (function ambient(){
    var c = document.getElementById("bgCanvas");
    var ctx = c.getContext("2d");
    var pts = [];
    function resize(){
      c.width = innerWidth; c.height = innerHeight;
      pts = [];
      var n = innerWidth<500 ? 30 : 54;
      for(var i=0;i<n;i++) pts.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.2+.4, s:Math.random()*.14+.03, o:Math.random()*.5+.14, p:Math.random()*6.28});
    }
    resize();
    addEventListener("resize", resize);
    function draw(t){
      ctx.clearRect(0,0,c.width,c.height);
      for(var i=0;i<pts.length;i++){
        var p=pts[i];
        if(!REDUCED){ p.y-=p.s; if(p.y<-4){p.y=c.height+4; p.x=Math.random()*c.width;} }
        var flick = REDUCED?1:(0.65+0.35*Math.sin(t/1500+p.p));
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.29);
        ctx.fillStyle = "rgba(251,243,234,"+(p.o*flick*0.55).toFixed(3)+")";
        ctx.fill();
      }
      if(!REDUCED) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();

    if(quiet || REDUCED || p===0){ el.textContent=fmtPct(p); return; }
    var start=performance.now(), dur=1100;
    function step(t){ var k=Math.min(1,(t-start)/dur); var e=1-Math.pow(1-k,3); el.textContent=fmtPct(p*e); if(k<1) requestAnimationFrame(step); else el.textContent=fmtPct(p); }
    requestAnimationFrame(step);
  }
  function copyText(text, btn, okLabel){
    var orig=btn.textContent;
    function done(){ btn.textContent=okLabel; btn.classList.add("copied"); setTimeout(function(){ btn.textContent=orig; btn.classList.remove("copied"); },1800); }
    try{ navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text,done); }); }catch(e){ fallbackCopy(text,done); }
  }
  function fallbackCopy(text,cb){ try{ var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); cb(); }catch(e){} }

  document.addEventListener("keydown",function(e){ if(e.key==="Enter" && S.screen>=0 && S.screen<=6){ var n=document.getElementById("next")||document.getElementById("start"); if(n && document.activeElement.tagName!=="BUTTON") n.click(); } });

  // ---------- boot ----------
  if(decodeState(location.hash)){ S.shared=true; S.screen=7; }
  render();
})();
</script>
